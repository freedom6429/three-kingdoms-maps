<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三國立體地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --sky-top:#C3D2CE; --sky-bot:#E6ECE5;
  --ink:#22302D; --ink-soft:#58665F; --panel:rgba(243,246,241,.94); --line:rgba(34,48,45,.16);
  --halo:rgba(238,243,236,.95);
  --zz:#8A3325; --jz:#2F4E73; --xian:#5B6560; --battle:#A8741E; --water:#2F6F8C; --mtn:#6B5539;
  --focus:#2F5D8A;
  --serif:"Noto Serif TC","Songti TC","PMingLiU","STSong",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky-top:#152127; --sky-bot:#27363B;
    --ink:#E3EAE6; --ink-soft:#A6B4AE; --panel:rgba(28,40,44,.94); --line:rgba(227,234,230,.16);
    --halo:rgba(22,33,37,.92);
    --zz:#E38D79; --jz:#8FB2DC; --xian:#AEB9B4; --battle:#E0AE55; --water:#79B8D2; --mtn:#D9BF94;
    --focus:#9CC3EA;
  }
}
:root[data-theme="dark"]{
  --sky-top:#152127; --sky-bot:#27363B;
  --ink:#E3EAE6; --ink-soft:#A6B4AE; --panel:rgba(28,40,44,.94); --line:rgba(227,234,230,.16);
  --halo:rgba(22,33,37,.92);
  --zz:#E38D79; --jz:#8FB2DC; --xian:#AEB9B4; --battle:#E0AE55; --water:#79B8D2; --mtn:#D9BF94;
  --focus:#9CC3EA;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--sky-top);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;font-family:var(--sans);color:var(--ink);
  background:linear-gradient(var(--sky-top),var(--sky-bot));-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#gl{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;border:0;background:none;padding:0;margin:0;
  font-family:var(--serif);color:var(--ink);pointer-events:auto;cursor:pointer;
  text-shadow:0 0 2px var(--halo),0 0 5px var(--halo),0 0 9px var(--halo);will-change:transform}
.lbl.hide{visibility:hidden}
.lbl:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:3px}
.lbl span{display:block;line-height:1.15}
.city span{font-size:13px;font-weight:700}
.city.r1 span{font-size:16px;font-weight:900;letter-spacing:.06em}
.city.r3 span{font-size:12px;font-weight:500}
.city i,.battle i{display:block;width:8px;height:8px;margin:3px auto 0;border-radius:50%;
  background:var(--k);box-shadow:0 0 0 1.5px var(--halo)}
.city.r1 i{width:11px;height:11px;box-shadow:0 0 0 1.5px var(--halo),0 0 0 3px var(--k)}
.battle span{font-size:12px;font-weight:700;color:var(--battle)}
.battle i{border-radius:1px;transform:rotate(45deg);background:var(--battle);width:7px;height:7px}
.zhou{pointer-events:none;font-weight:900;font-size:22px;letter-spacing:.4em;color:var(--ink);opacity:.42}
.zhou small{display:block;font-size:11px;letter-spacing:.1em;font-weight:500;text-align:center;opacity:.9}
.mtn span{font-size:12px;font-weight:500;letter-spacing:.2em;color:var(--mtn)}
.region span{font-size:15px;font-weight:700;letter-spacing:.5em;color:var(--mtn);opacity:.8}
.river span,.lake span{font-size:12px;font-weight:500;letter-spacing:.12em;color:var(--water)}
.sea{pointer-events:none;font-size:17px;letter-spacing:.7em;color:var(--water);opacity:.7}
.lbl.selected span{background:var(--ink);color:var(--sky-bot);text-shadow:none;padding:1px 5px;border-radius:4px}

/* search */
#top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:center;pointer-events:none}
#searchWrap{position:relative;width:100%;max-width:520px;pointer-events:auto}
#q{width:100%;font:16px/1.3 var(--sans);color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:22px;padding:11px 16px 11px 40px;outline:none;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#q:focus-visible{border-color:var(--focus);box-shadow:0 0 0 2px var(--focus)}
#q::placeholder{color:var(--ink-soft)}
#searchWrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--ink-soft)}
#results{list-style:none;margin:6px 0 0;padding:4px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;max-height:50vh;overflow-y:auto;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#results[hidden]{display:none}
#results li button{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;border:0;background:none;
  font:inherit;color:var(--ink);padding:9px 12px;border-radius:10px;cursor:pointer}
#results li button:hover,#results li button.active{background:var(--line)}
#results li button:focus-visible{outline:2px solid var(--focus)}
#results b{font-family:var(--serif);font-size:16px}
#results em{font-style:normal;font-size:12px;color:var(--ink-soft)}
#results .empty{padding:10px 12px;font-size:14px;color:var(--ink-soft);line-height:1.5}

/* compass */
#compass{position:absolute;top:66px;right:12px;width:46px;height:46px;border-radius:50%;
  border:1px solid var(--line);background:var(--panel);cursor:pointer;padding:0}
#compass svg{width:100%;height:100%;display:block}
#compass:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* legend & layers */
#legend{position:absolute;left:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:9px 12px;font-size:12px;line-height:1.5;max-width:calc(100% - 90px)}
#legend h1{font-family:var(--serif);font-size:15px;margin:0 0 2px;font-weight:900;letter-spacing:.08em}
#legend .row{display:flex;gap:12px;flex-wrap:wrap}
#legend .sw.dot{border-radius:50%}
#legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
#legend p{margin:3px 0 0;color:var(--ink-soft)}
#layerBtn{position:absolute;right:12px;bottom:12px;height:44px;padding:0 16px;border-radius:22px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 14px var(--sans);cursor:pointer}
#layerBtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#layers{position:absolute;right:12px;bottom:64px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:8px 6px;min-width:170px}
#layers[hidden]{display:none}
#layers label{display:flex;align-items:center;gap:10px;padding:8px 10px;font-size:14px;cursor:pointer}
#layers input{width:18px;height:18px;accent-color:var(--focus)}

/* card */
#card{position:absolute;left:12px;right:12px;bottom:12px;margin:0 auto;max-width:460px;background:var(--panel);
  border:1px solid var(--line);border-radius:16px;padding:16px 18px 18px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:transform .25s ease,opacity .25s ease}
#card[hidden]{display:block;transform:translateY(20px);opacity:0;pointer-events:none;visibility:hidden}
#card h2{font-family:var(--serif);font-size:26px;font-weight:900;margin:0 36px 2px 0;letter-spacing:.06em}
#card .now{margin:0 0 8px;font-size:14px;color:var(--ink-soft)}
#card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
#card .tag{font-size:12px;padding:2px 9px;border-radius:10px;border:1px solid var(--line)}
#card .tag.k{color:#fff;border-color:transparent;background:var(--zz)}
#card .note{margin:0;font-size:15px;line-height:1.7}
#close{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;border:0;background:var(--line);
  color:var(--ink);font-size:20px;line-height:36px;cursor:pointer;padding:0}
#close:focus-visible{outline:2px solid var(--focus)}

#hint{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:6px 14px;font-size:13px;color:var(--ink-soft);white-space:nowrap;transition:opacity .6s}
#hint.gone{opacity:0;pointer-events:none}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);
  font-size:18px;letter-spacing:.3em;color:var(--ink-soft)}
@media (prefers-reduced-motion: reduce){#card{transition:none}#hint{transition:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="gl" aria-label="三國時代立體地形地圖"></canvas>
  <div id="labels"></div>
  <div id="loading">繪製山川中</div>

  <div id="top">
    <div id="searchWrap" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="搜尋城市、郡名、山川，古名今名皆可" autocomplete="off" aria-label="搜尋地點" aria-controls="results">
      <ul id="results" hidden></ul>
    </div>
  </div>

  <button id="compass" title="轉回北方朝上" aria-label="指北針，點一下轉回北方朝上">
    <svg viewBox="0 0 46 46" aria-hidden="true"><g id="needle" style="transform-origin:23px 23px">
      <path d="M23 6 L28 23 L23 21 L18 23 Z" fill="#B24A3A"/>
      <path d="M23 40 L28 23 L23 25 L18 23 Z" fill="currentColor" opacity=".35"/>
      <text x="23" y="16.5" text-anchor="middle" font-size="8" font-weight="700" fill="#fff" font-family="serif">北</text>
    </g></svg>
  </button>

  <div id="hint"></div>

  <div id="legend">
    <h1>三國立體地圖</h1>
    <div class="row">
      <span><span class="sw dot" style="background:var(--zz)"></span>州治、都城</span>
      <span><span class="sw dot" style="background:var(--jz)"></span>郡治</span>
    </div>
    <p>以東漢末年十三州為準，位置與界線為示意。</p>
    <p><a href="./" style="color:var(--focus);font-weight:600">回目錄</a></p>
  </div>

  <button id="layerBtn" aria-expanded="false" aria-controls="layers">圖層</button>
  <div id="layers" hidden>
    <label><input type="checkbox" data-layer="borders" checked>州界</label>
    <label><input type="checkbox" data-layer="zhou" checked>州名</label>
    <label><input type="checkbox" data-layer="cities" checked>城市</label>
    <label><input type="checkbox" data-layer="terrain" checked>山脈地形</label>
    <label><input type="checkbox" data-layer="water" checked>河湖海</label>
  </div>

  <div id="card" hidden role="dialog" aria-live="polite">
    <button id="close" aria-label="關閉">×</button>
    <h2></h2><p class="now"></p><div class="tags"></div><p class="note"></p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
"use strict";
/* ============ 資料 ============ */
// 東漢末年十三州（三國時代沿用的州郡架構）
const ZHOU=[
 {name:"司隸",at:[111.1,35.2],note:"京城洛陽周邊的特別行政區，長官稱司隸校尉。三國時魏改稱司州。"},
 {name:"豫州",at:[115.0,33.3],note:"東漢末年十三州之一，漢獻帝所在的許都就在豫州。"},
 {name:"兗州",at:[116.1,35.7],note:"東漢末年十三州之一，曹操早年的根據地。"},
 {name:"徐州",at:[118.6,34.0],note:"東漢末年十三州之一，陶謙、劉備、呂布曾先後在此爭奪。"},
 {name:"青州",at:[118.7,36.6],note:"東漢末年十三州之一。"},
 {name:"冀州",at:[115.5,37.7],note:"東漢末年十三州之一，袁紹的根據地，後為曹操所得。"},
 {name:"幽州",at:[118.0,40.9],note:"東漢末年十三州之一，公孫瓚、劉虞曾在此爭奪；遼東由公孫氏割據。"},
 {name:"并州",at:[111.6,39.0],note:"東漢末年十三州之一。"},

 {name:"益州",at:[104.6,28.9],note:"東漢末年十三州之一，劉焉、劉璋父子治理，後為蜀漢的全部國土。南部稱為「南中」。"},
 {name:"荊州",at:[111.8,29.3],note:"東漢末年十三州之一，劉表治理。赤壁之戰後被曹操、劉備、孫權三家分割，219 年後南部歸吳。"},
 {name:"揚州",at:[117.6,29.4],note:"東漢末年十三州之一。孫氏的根據地「江東」在此；三國時北部淮南屬魏，魏吳各設一個揚州。"},
 {name:"交州",at:[108.8,23.0],note:"東漢末年十三州之一，南方邊地，士燮家族長期治理，後歸吳國管轄。"}
];
const ZI={};ZHOU.forEach((z,i)=>ZI[z.name]=i);
const PLACES=[];

function J(zhou,jun,rows){for(const r of rows){const f=r[6]||"";PLACES.push({name:r[0],lon:r[1],lat:r[2],now:r[3],note:r[4]||"",alias:r[5]?r[5].split("、"):[],zhou,jun,seat:f.includes("J"),zz:f.includes("Z"),rank:f.includes("1")?1:(f.includes("J")||f.includes("Z"))?2:3,type:"city"})}}
function B(name,lon,lat,zhou,now,note,alias,rank){PLACES.push({name,lon,lat,zhou,jun:"",now,note,alias:alias?alias.split("、"):[],rank:rank||2,type:"battle"})}

J("司隸","河南尹",[
 ["洛陽",112.45,34.62,"河南洛陽","東漢首都，也是魏國都城。董卓焚城西遷後殘破，曹丕稱帝後重建。","雒陽","1JZ"],
 ["滎陽",113.35,34.79,"河南滎陽","190 年曹操追擊董卓，在滎陽汴水被徐榮擊敗。",""],
 ["成皋",113.23,34.87,"河南滎陽汜水鎮","縣境有虎牢關，是洛陽東方的險關，《三國演義》「三英戰呂布」的所在。","虎牢關、汜水關、汜水"],
 ["偃師",112.79,34.73,"河南偃師","",""],
 ["鞏",113.02,34.75,"河南鞏義","","鞏縣"],
 ["中牟",113.98,34.72,"河南中牟","《三國演義》中，陳宮任中牟縣令，在此放走逃亡的曹操。",""],
 ["密",113.38,34.5,"河南新密","","密縣"]]);
J("司隸","河內郡",[
 ["懷",113.2,35.05,"河南武陟西南","","懷縣","J"],
 ["溫",113.08,34.94,"河南溫縣","司馬懿的家鄉。","溫縣"],
 ["河陽",112.79,34.91,"河南孟州","",""],
 ["野王",112.93,35.09,"河南沁陽","",""],
 ["朝歌",114.2,35.6,"河南淇縣","",""],
 ["汲",114.07,35.4,"河南衛輝","","汲縣"],
 ["修武",113.45,35.23,"河南修武","",""],
 ["山陽",113.4,35.3,"河南焦作東","漢獻帝退位後被封為山陽公，居住在此。",""]]);
J("司隸","河東郡",[
 ["安邑",111.1,35.1,"山西夏縣西北","","","J"],
 ["解",110.85,34.92,"山西運城解州鎮","關羽的家鄉。","解縣、解良"],
 ["平陽",111.52,36.08,"山西臨汾","",""],
 ["蒲坂",110.32,34.83,"山西永濟","",""],
 ["聞喜",111.22,35.36,"山西聞喜","",""],
 ["皮氏",110.7,35.6,"山西河津","",""]]);
J("司隸","弘農郡",[
 ["弘農",110.87,34.52,"河南靈寶","漢獻帝從長安東歸洛陽時曾經過此地。","","J"],
 ["陝",111.2,34.77,"河南三門峽","","陝縣"],
 ["華陰",110.08,34.57,"陝西華陰","",""],
 ["宜陽",112.17,34.52,"河南宜陽","",""],
 ["黽池",111.76,34.77,"河南澠池","","澠池"],
 ["新安",112.13,34.73,"河南新安","",""],
 ["盧氏",111.05,34.05,"河南盧氏","",""]]);
J("司隸","京兆尹",[
 ["長安",108.9,34.27,"陝西西安","西漢故都。董卓挾持漢獻帝遷都於此；三國時是魏在關中的重鎮。","西安","1J"],
 ["霸陵",109.12,34.25,"陝西西安東","",""],

 ["鄭",109.77,34.5,"陝西華縣","","鄭縣"],
 ["藍田",109.32,34.15,"陝西藍田","",""],
 ["上雒",109.93,33.87,"陝西商洛","",""]]);

 ["池陽",108.85,34.62,"陝西涇陽","",""],
 ["頻陽",108.97,34.8,"陝西富平","",""]]);
J("司隸","右扶風",[
 ["槐里",108.47,34.3,"陝西興平","","","J"],
 ["郿",107.75,34.27,"陝西眉縣","董卓在此修築郿塢，囤積大量糧食財寶。","郿塢、眉縣"],
 ["陳倉",107.14,34.36,"陝西寶雞","228 年郝昭據守陳倉，諸葛亮圍攻二十多天未能攻下。","寶雞"],

 ["美陽",108.0,34.3,"陝西武功一帶","",""],
 ["汧",106.83,34.9,"陝西隴縣","","汧縣"],
 ["漆",108.1,35.05,"陝西彬州","","漆縣"]]);

J("豫州","沛國",[
 ["相",116.8,33.95,"安徽淮北西北","","相縣","J"],
 ["譙",115.78,33.85,"安徽亳州","曹操的家鄉。東漢豫州治所。","亳州、譙縣","Z"],
 ["沛",116.93,34.72,"江蘇沛縣","劉備早年屯兵之地，俗稱小沛。《三國演義》中呂布在此「轅門射戟」。","小沛、沛縣"],

J("豫州","潁川郡",[
 ["陽翟",113.47,34.15,"河南禹州","","","J"],

/* ============ 地形計算 ============ */
const KX=0.87, LON0=111, LAT0=30.5, VS=0.9;
const LONMIN=97, LONMAX=125, LATMIN=18, LATMAX=43;
const wx=lon=>(lon-LON0)*KX, wz=lat=>-(lat-LAT0);
const sstep=(a,b,x)=>{let t=(x-a)/(b-a);t=t<0?0:t>1?1:t;return t*t*(3-2*t)};
const sbox=(x,a,b,e)=>sstep(a-e,a+e,x)*(1-sstep(b-e,b+e,x));
function inPoly(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];
 if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c}
function toSegs(pts){const s=[];for(let i=0;i<pts.length-1;i++)s.push([pts[i][0]*KX,pts[i][1],pts[i+1][0]*KX,pts[i+1][1]]);return s}
function segDist(px,py,s){const ax=s[0],ay=s[1],dx=s[2]-ax,dy=s[3]-ay;let t=((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy);
 t=t<0?0:t>1?1:t;const ex=ax+t*dx-px,ey=ay+t*dy-py;return Math.sqrt(ex*ex+ey*ey)}
function minDist(px,py,segs){let m=1e9;for(const s of segs){const d=segDist(px,py,s);if(d<m)m=d}return m}
const noise=(x,y)=>0.5+0.22*Math.sin(x*3.1+y*1.7)*Math.cos(y*2.3-x*0.9)+0.16*Math.sin(x*7.3+1.3)*Math.sin(y*6.1)+0.1*Math.sin((x+y)*11.0);
const noise2=(x,y)=>0.5+0.3*Math.sin(x*9.7+y*4.1)*Math.cos(y*8.3-x*2.9)+0.2*Math.sin(x*17.1-y*13.3);
function bbox(segs,m){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const q of segs){a=Math.min(a,q[0],q[2]);b=Math.min(b,q[1],q[3]);c=Math.max(c,q[0],q[2]);d=Math.max(d,q[1],q[3])}return[a-m,b-m,c+m,d+m]}
const rangeSegs=RANGES.map(r=>{const segs=toSegs(r[3]);return{h:r[1],w:r[2],segs,bb:bbox(segs,r[2]*2.6)}});
const riverSegs=RIVERS.map(r=>{const segs=toSegs(r[2]);return{major:r[1],segs,bb:bbox(segs,0.9)}});
/* 平滑雜訊：讓山脊有稜線、支脈與溝谷 */
function hash2(i,j){let h=Math.imul(i,374761393)^Math.imul(j,668265263);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296}
function vnoise(x,y){const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
 const a=hash2(i,j),b=hash2(i+1,j),c=hash2(i,j+1),d=hash2(i+1,j+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y){let t=0,a=0.5,f=1;for(let o=0;o<4;o++){t+=a*vnoise(x*f+o*31.7,y*f-o*12.9);f*=2.03;a*=0.5}return t/0.9375}
function ridged(x,y){let t=0,a=0.5,f=1,w=1;for(let o=0;o<4;o++){let n=1-Math.abs(2*vnoise(x*f+o*17.3,y*f-o*9.1)-1);n*=n;n*=w;w=Math.min(1,n*1.7);t+=a*n;f*=2.1;a*=0.5}return t/0.9375}

function isSea(lon,lat){
 if(!inPoly(lon,lat,SEA_POLY))return false;
 for(const is of ISLANDS)if(inPoly(lon,lat,is))return false;
 return true;
}
function rawHeight(lon,lat){
 if(isSea(lon,lat))return -0.3;
 for(const L of LAKES){const dx=(lon-L[1])/L[3],dy=(lat-L[2])/L[4];if(dx*dx+dy*dy<1)return -0.08}
 const n=noise(lon,lat),f=fbm(lon*1.3,lat*1.3),rg=ridged(lon*1.8,lat*1.8);
 // 地形區的邊界也扭曲，避免出現方方正正的高原
 const ul=lon+1.0*(fbm(lon*0.45,lat*0.45+5.3)-0.5),ut=lat+1.0*(fbm(lon*0.45+9.1,lat*0.45)-0.5);
 const tib=sbox(ul,90,102.5,0.8)*sbox(ut,28.3,37.2,0.9);
 const yg=sbox(ul,101.5,107.8,1.1)*sbox(ut,23.2,27.6,1.0);
 const loess=sbox(ul,104.8,112.2,0.9)*sbox(ut,35.0,39.6,0.8);
 const mong=sbox(ul,104,119,1.2)*sstep(40.2,41.6,ut);
 const south=sbox(ul,109.5,120.5,1.4)*sbox(ut,22.5,29.6,1.1);
 const zj=sbox(ul,117.5,121,0.8)*sbox(ut,26.5,30.5,0.8);
 const ne=sbox(ul,118,126,0.8)*sstep(40.4,42.1,ut);
 let b=0.045+0.05*f;
 b+=tib*(1.3+0.25*f+0.45*(rg-0.35));
 b+=yg*(0.3+0.25*f+0.22*(rg-0.3));
 b+=loess*(0.3+0.2*f+0.1*(rg-0.3));
 b+=mong*(0.36+0.12*f);
 b+=south*(0.06+0.18*f+0.16*rg);
 b+=zj*(0.08+0.2*f+0.18*rg);
 b+=ne*(0.1+0.2*f+0.15*rg);
 // 山脈：座標加一點扭曲，稜線才不會像尺畫的；再乘上脊狀雜訊，形成主脊與支脈
 const px=lon*KX,py=lat;
 const qx=px+0.32*(fbm(lon*0.8+3.1,lat*0.8)-0.5),qy=py+0.32*(fbm(lon*0.8,lat*0.8+7.7)-0.5);
 for(const r of rangeSegs){
  if(qx<r.bb[0]||qx>r.bb[2]||qy<r.bb[1]||qy>r.bb[3])continue;
  const d=minDist(qx,qy,r.segs);const e=Math.exp(-(d*d)/(r.w*r.w));
  const core=Math.exp(-(d*d)/(r.w*r.w*0.25));
  b+=r.h*(e*(0.3+0.95*rg)+0.25*core)*(0.85+0.3*n);
 }
 let dv=1e9;
 for(const r of riverSegs){if(px<r.bb[0]||px>r.bb[2]||py<r.bb[1]||py>r.bb[3])continue;const d=minDist(px,py,r.segs)/(r.major?1:0.7);if(d<dv)dv=d}
 b-=(b-0.03)*0.62*Math.exp(-(dv*dv)/0.05);
 if(b>1.7)b=1.7+(b-1.7)*0.35;
 return b;
}
const ySurf=(lon,lat)=>Math.max(rawHeight(lon,lat),0)*VS;

/* 勢力種子 */
const SEEDS=PLACES.filter(p=>p.type==="city").map(p=>({zi:ZI[p.zhou],x:p.lon*KX,y:p.lat}));
const BUCK=new Map();for(const s of SEEDS){const k=Math.floor(s.x)+","+Math.floor(s.y);if(!BUCK.has(k))BUCK.set(k,[]);BUCK.get(k).push(s)}
function nearSeeds(px,py){const out=[],cx=Math.floor(px),cy=Math.floor(py);for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++){const b=BUCK.get((cx+i)+","+(cy+j));if(b)out.push(...b)}return out}
const SEED_MAX=1.6;

const RAMP=[[0,[0.62,0.71,0.53]],[0.18,[0.71,0.71,0.52]],[0.45,[0.69,0.61,0.45]],[0.9,[0.57,0.49,0.40]],[1.4,[0.67,0.63,0.59]],[1.9,[0.94,0.94,0.93]]];
function ramp(h){if(h<0)return[0.40,0.56,0.62];for(let i=1;i<RAMP.length;i++){if(h<=RAMP[i][0]){const a=RAMP[i-1],b=RAMP[i],t=(h-a[0])/(b[0]-a[0]);

function buildTerrain(){
 let i=0;
 for(let r=0;r<=NZ;r++){
  const lat=LATMAX-(LATMAX-LATMIN)*r/NZ;
  for(let c=0;c<=NX;c++,i++){
   const lon=LONMIN+(LONMAX-LONMIN)*c/NX;
   const h=rawHeight(lon,lat);
   pos[i*3]=wx(lon);pos[i*3+1]=h*VS;pos[i*3+2]=wz(lat);
   hArr[i]=h;
   if(h>-0.05){
    const px=lon*KX,cand=nearSeeds(px,lat);let d1=1e9,s1=null;
    for(const q of cand){const dx=q.x-px,dy=q.y-lat,d=dx*dx+dy*dy;if(d<d1){d1=d;s1=q}}
    d1=Math.sqrt(d1);
    if(s1&&d1<SEED_MAX){
     let d2=1e9;for(const q of cand){if(q.zi===s1.zi)continue;const dx=q.x-px,dy=q.y-lat,d=dx*dx+dy*dy;if(d<d2)d2=d}
     d2=Math.sqrt(d2);
     if(d2<SEED_MAX&&d2-d1<0.09)vBorder[i]=1;
    }
   }
  }
 }
 const idx=new Uint32Array(NX*NZ*6);let k=0;
 for(let r=0;r<NZ;r++)for(let c=0;c<NX;c++){const a=r*(NX+1)+c,b=a+1,d=a+NX+1,e=d+1;idx[k++]=a;idx[k++]=d;idx[k++]=b;idx[k++]=b;idx[k++]=d;idx[k++]=e}
 const g=new THREE.BufferGeometry();
 g.setAttribute("position",new THREE.BufferAttribute(pos,3));
 g.setAttribute("color",new THREE.BufferAttribute(col,3));
 g.setIndex(new THREE.BufferAttribute(idx,1));
 g.computeVertexNormals();
 // 上色：高度分帶，陡坡露岩，高處積雪，溝谷壓暗、稜線提亮
 const nrm=g.attributes.normal.array,W=NX+1,ROCK=[0.49,0.44,0.39],SNOW=[0.95,0.95,0.96];
 for(let r=0;r<=NZ;r++)for(let c=0;c<=W-1;c++){
  const i=r*W+c,h=hArr[i];let rc=ramp(h).slice();
  if(h>=0){
   const lat=LATMAX-(LATMAX-LATMIN)*r/NZ,lon=LONMIN+(LONMAX-LONMIN)*c/NX;
   const sl=1-nrm[i*3+1],rock=sstep(0.1,0.34,sl);vRock[i]=rock;
   for(let k=0;k<3;k++)rc[k]+=(ROCK[k]-rc[k])*rock*0.75;
   const sn=sstep(1.12,1.42,h+0.3*(noise2(lon,lat)-0.5))*(1-sstep(0.28,0.5,sl));
   for(let k=0;k<3;k++)rc[k]+=(SNOW[k]-rc[k])*sn;
   if(r>0&&r<NZ&&c>0&&c<NX){
    const lap=(Math.max(hArr[i-1],0)+Math.max(hArr[i+1],0)+Math.max(hArr[i-W],0)+Math.max(hArr[i+W],0))/4-h;
    const cav=Math.max(-0.22,Math.min(0.3,lap*7));
    for(let k=0;k<3;k++)rc[k]*=1-cav*0.7;
   }
  }
  vBase[i*3]=rc[0];vBase[i*3+1]=rc[1];vBase[i*3+2]=rc[2];
 }
 return g;
}

 el.className="lbl hide "+o.cls;el.innerHTML=o.html;
 if(o.k)el.style.setProperty("--k",`var(--${o.k})`);
 if(o.clickable){el.type="button";el.setAttribute("aria-label",o.item.name+"，"+o.item.typeName);el.addEventListener("click",e=>{e.stopPropagation();select(o.item)})}
 labelBox.appendChild(el);
 const L={el,pos:new THREE.Vector3(wx(o.lon),o.y,wz(o.lat)),layer:o.layer,minD:o.minD||0,maxD:o.maxD||99,prio:o.prio,cull:o.cull!==false,anchor:o.anchor||"bottom",w:0,h:0,shown:false,item:o.item};
 labels.push(L);if(o.item)o.item.label=L;return L;
}
function buildLabels(){
 for(const z of ZHOU){
  const it={name:z.name,typeName:"州",lon:z.at[0],lat:z.at[1],note:z.note,now:"",search:[z.name,z.name.replace("州","")],zoom:12};
  if(z.name==="司隸")it.search.push("司州");
  items.push(it);
  addLabel({cls:"zhou",html:z.name,lon:z.at[0],lat:z.at[1],y:ySurf(z.at[0],z.at[1])+0.6,layer:"zhou",minD:4,maxD:40,prio:0,cull:false,anchor:"center",item:it});
 }
 for(const p of SHOWN){
  const battle=p.type==="battle";
  const it={name:p.name,typeName:battle?"戰場、名勝":"城市",lon:p.lon,lat:p.lat,rank:p.rank,now:p.now,note:p.note,alias:p.alias,zhou:p.zhou,jun:p.jun,seat:p.seat,zz:p.zz,
   search:[p.name,p.now,...p.alias,...(p.seat?[p.jun]:[])],zoom:p.rank===3?3.6:5};
  items.push(it);
  addLabel({cls:(battle?"battle":"city")+" r"+p.rank,html:`<span>${p.name}</span><i></i>`,k:battle?null:dotKind(p),lon:p.lon,lat:p.lat,y:ySurf(p.lon,p.lat)+0.02,
   layer:battle?"battles":"cities",maxD:[0,99,24,7][p.rank],prio:[0,1,3,6][p.rank]+(battle?1:0),clickable:true,item:it});
 }
 for(const r of RANGES){
  const it={name:r[0],typeName:"山脈",lon:r[4][0],lat:r[4][1],note:r[5],search:[r[0]],zoom:7};items.push(it);
  addLabel({cls:"mtn",html:`<span>${r[0]}</span>`,lon:r[4][0],lat:r[4][1],y:ySurf(r[4][0],r[4][1])+0.35,layer:"terrain",maxD:20,prio:4,clickable:true,anchor:"center",item:it});
 }
 for(const r of REGIONS){
  const it={name:r[0],typeName:"地形",lon:r[1],lat:r[2],note:r[3],search:[r[0]],zoom:9};items.push(it);
  addLabel({cls:"region",html:`<span>${r[0]}</span>`,lon:r[1],lat:r[2],y:ySurf(r[1],r[2])+0.5,layer:"terrain",minD:5,maxD:40,prio:4,clickable:true,anchor:"center",item:it});
 }
 for(const r of RIVERS){
  const it={name:r[0],typeName:"河流",lon:r[3][0],lat:r[3][1],note:r[4],search:[r[0]],zoom:7};items.push(it);
  addLabel({cls:"river",html:`<span>${r[0]}</span>`,lon:r[3][0],lat:r[3][1],y:ySurf(r[3][0],r[3][1])+0.12,layer:"water",maxD:r[1]?30:16,prio:5,clickable:true,anchor:"center",item:it});
 }
 for(const l of LAKES){
  const it={name:l[0],typeName:"湖泊",lon:l[1],lat:l[2],note:l[5],search:[l[0],l[0]==="雲夢澤"?"洞庭湖":"",l[0]==="彭蠡澤"?"鄱陽湖":""].filter(Boolean),zoom:5};items.push(it);
  addLabel({cls:"lake",html:`<span>${l[0]}</span>`,lon:l[1],lat:l[2],y:0.1,layer:"water",maxD:16,prio:5,clickable:true,anchor:"center",item:it});
 }
 for(const s of SEAS){
  const it={name:s[0],typeName:"海",lon:s[1],lat:s[2],note:"",search:[s[0]],zoom:12};items.push(it);
  addLabel({cls:"sea",html:s[0],lon:s[1],lat:s[2],y:0.05,layer:"water",prio:0,cull:false,anchor:"center",item:it});
 }
 labels.sort((a,b)=>a.prio-b.prio);
}
function measure(){labelsDirty=true;for(const L of labels){const was=L.el.classList.contains("hide");L.el.classList.remove("hide");L.w=L.el.offsetWidth;L.h=L.el.offsetHeight;if(was)L.el.classList.add("hide")}}

const v3=new THREE.Vector3();let selected=null;
function updateLabels(){
 const W=canvas.clientWidth,H=canvas.clientHeight,D=camera.position.distanceTo(controls.target);
 const placed=[];
 const order=selected&&selected.label?[selected.label,...labels.filter(l=>l!==selected.label)]:labels;
 for(const L of order){
  const isSel=selected&&L===selected.label;
  let vis=isSel||(layers[L.layer]&&D>=L.minD&&D<=L.maxD);
  let x=0,y=0;
  if(vis){v3.copy(L.pos).project(camera);if(v3.z>1||Math.abs(v3.x)>1.15||Math.abs(v3.y)>1.15)vis=false;else{x=(v3.x+1)/2*W;y=(1-v3.y)/2*H}}
  if(vis&&L.cull){
   const x0=x-L.w/2,y0=L.anchor==="bottom"?y-L.h:y-L.h/2,b=[x0-2,y0-2,x0+L.w+2,y0+L.h+2];
   if(!isSel)for(const p of placed){if(b[0]<p[2]&&b[2]>p[0]&&b[1]<p[3]&&b[3]>p[1]){vis=false;break}}
   if(vis)placed.push(b);
  }
  if(vis){L.el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,${L.anchor==="bottom"?"-100%":"-50%"})`;
   if(!L.shown){L.el.classList.remove("hide");L.shown=true}}
  else if(L.shown){L.el.classList.add("hide");L.shown=false}
 }
}

/* ============ 操作 ============ */
const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true;controls.dampingFactor=0.1;controls.screenSpacePanning=false;
controls.mouseButtons={LEFT:THREE.MOUSE.PAN,MIDDLE:THREE.MOUSE.DOLLY,RIGHT:THREE.MOUSE.ROTATE};
controls.touches={ONE:THREE.TOUCH.PAN,TWO:THREE.TOUCH.DOLLY_ROTATE};
controls.minDistance=2.2;controls.maxDistance=32;controls.maxPolarAngle=Math.PI*0.43;controls.minPolarAngle=0.05;
const XMIN=wx(LONMIN),XMAX=wx(LONMAX),ZMIN=wz(LATMAX),ZMAX=wz(LATMIN);
controls.addEventListener("change",()=>{
 const t=controls.target,cx=Math.min(XMAX,Math.max(XMIN,t.x)),cz=Math.min(ZMAX,Math.max(ZMIN,t.z));
 if(cx!==t.x||cz!==t.z){camera.position.x+=cx-t.x;camera.position.z+=cz-t.z;t.x=cx;t.z=cz}
 needle.style.transform=`rotate(${controls.getAzimuthalAngle()}rad)`;
});
controls.addEventListener("start",()=>{hideHint();fly=null});
const needle=document.getElementById("needle");

let fly=null;
function flyTo(tx,ty,tz,dist,az){
 const off=camera.position.clone().sub(controls.target);
 if(az!==undefined){const hlen=Math.hypot(off.x,off.z);off.x=Math.sin(az)*hlen;off.z=Math.cos(az)*hlen}
 if(dist)off.setLength(dist);
 const endT=new THREE.Vector3(tx,ty,tz),endP=endT.clone().add(off);
 if(reduceMotion){controls.target.copy(endT);camera.position.copy(endP);controls.update();return}
 fly={t0:performance.now(),dur:1000,sT:controls.target.clone(),sP:camera.position.clone(),eT:endT,eP:endP};
}
function stepFly(now){
 if(!fly)return;let t=Math.min(1,(now-fly.t0)/fly.dur);const e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
 controls.target.lerpVectors(fly.sT,fly.eT,e);camera.position.lerpVectors(fly.sP,fly.eP,e);
 if(t>=1)fly=null;
}
document.getElementById("compass").addEventListener("click",()=>{const t=controls.target;flyTo(t.x,t.y,t.z,null,0)});

/* 資訊卡 */
const card=document.getElementById("card");
function select(it){
 if(selected&&selected.label)selected.label.el.classList.remove("selected");
 selected=it;
 if(it.label)it.label.el.classList.add("selected");
 card.querySelector("h2").textContent=it.name;
 const now=card.querySelector(".now");now.textContent=it.now?"今 "+it.now:"";now.hidden=!it.now;
 const tags=card.querySelector(".tags");tags.innerHTML="";
 const addTag=(t,strong)=>{const e=document.createElement("span");e.className="tag"+(strong?" k":"");e.textContent=t;tags.appendChild(e)};
 if(it.zhou)addTag(it.zhou);
 if(it.jun)addTag(it.jun+(it.seat?"治所":""));
 if(it.zz)addTag("州治所",true);
 addTag(it.typeName);
 if(it.alias&&it.alias.length){const a=it.alias.filter(x=>x!==it.now&&!it.now.includes(x));if(a.length)addTag("又稱 "+a.join("、"))}
 const note=card.querySelector(".note");note.textContent=it.note||"";note.hidden=!it.note;
 card.hidden=false;labelsDirty=true;
 const y=ySurf(it.lon,it.lat);
 if(it.typeName==="城市"){ring.position.set(wx(it.lon),y+0.03,wz(it.lat));ring.visible=true}else ring.visible=false;
 const D=camera.position.distanceTo(controls.target);
 flyTo(wx(it.lon),y,wz(it.lat)+0.6,Math.min(D,it.zoom||6));
}
function closeCard(){labelsDirty=true;card.hidden=true;ring.visible=false;if(selected&&selected.label)selected.label.el.classList.remove("selected");selected=null}
document.getElementById("close").addEventListener("click",closeCard);
addEventListener("keydown",e=>{if(e.key==="Escape"){closeCard();hideResults()}});

/* 搜尋 */
const q=document.getElementById("q"),res=document.getElementById("results");
let hits=[],active=0;
function norm(s){return s.replace(/[臺]/g,"台").trim()}
function doSearch(){
 const s=norm(q.value);if(!s){hideResults();return}
 hits=items.map(it=>{let score=99;for(const w of it.search){const n=norm(w);if(n===s)score=Math.min(score,0);else if(n.startsWith(s))score=Math.min(score,1);else if(n.includes(s))score=Math.min(score,2)}
  return{it,score}}).filter(h=>h.score<99).sort((a,b)=>a.score-b.score||(a.it.rank||2)-(b.it.rank||2)).slice(0,8).map(h=>h.it);
 active=0;res.innerHTML="";
 if(!hits.length){res.innerHTML=`<li class="empty">找不到「${s.replace(/[<>&]/g,"")}」。試試古名或今名，例如「建業」或「南京」。</li>`}
 hits.forEach((it,i)=>{const li=document.createElement("li");const b=document.createElement("button");b.type="button";if(i===0)b.className="active";
  b.innerHTML=`<b></b><em></em>`;b.querySelector("b").textContent=it.name;b.querySelector("em").textContent=it.typeName+(it.now?"，今"+it.now:"");
  b.addEventListener("click",()=>pick(it));li.appendChild(b);res.appendChild(li)});
 res.hidden=false;
}
function hideResults(){res.hidden=true}
function pick(it){q.value=it.name;hideResults();q.blur();
 if(it.label&&!layers[it.label.layer]){} select(it)}
q.addEventListener("input",doSearch);
q.addEventListener("focus",()=>{if(q.value)doSearch()});
q.addEventListener("keydown",e=>{
 const bs=res.querySelectorAll("button");
 if(e.key==="ArrowDown"||e.key==="ArrowUp"){if(!bs.length)return;e.preventDefault();bs[active]&&bs[active].classList.remove("active");active=(active+(e.key==="ArrowDown"?1:-1)+bs.length)%bs.length;bs[active].classList.add("active");bs[active].scrollIntoView({block:"nearest"})}
 if(e.key==="Enter"&&hits[active]){e.preventDefault();pick(hits[active])}
});
canvas.addEventListener("pointerdown",()=>{hideResults();q.blur()});

/* 圖層 */
const layerBtn=document.getElementById("layerBtn"),layerPanel=document.getElementById("layers");
layerBtn.addEventListener("click",()=>{const open=layerPanel.hidden;layerPanel.hidden=!open;layerBtn.setAttribute("aria-expanded",String(open))});
layerPanel.addEventListener("change",e=>{const k=e.target.dataset.layer;layers[k]=e.target.checked;labelsDirty=true;
 if(k==="borders")paintTerrain();
 if(k==="cities"||k==="battles")markerGroup.children.forEach(m=>{m.visible=m.userData.type==="battle"?layers.battles:layers.cities});
});

/* 操作提示 */
const hint=document.getElementById("hint");
const touch=matchMedia("(pointer: coarse)").matches;
hint.textContent=touch?"單指拖曳移動，雙指旋轉與縮放":"左鍵拖曳移動，右鍵旋轉，滾輪縮放";
let hintTimer=setTimeout(hideHint,7000);
function hideHint(){hint.classList.add("gone");clearTimeout(hintTimer)}

/* ============ 啟動 ============ */
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
 camera.fov=w<h?52:40;camera.updateProjectionMatrix()}
addEventListener("resize",resize);

const lastM=new Float32Array(16);let labelsDirty=true;
function animate(now){
 stepFly(now);controls.update();
 if(ring.visible&&!reduceMotion){const s=1+0.25*Math.sin(now/300);ring.scale.set(s,s,s)}
 renderer.render(scene,camera);
 const e=camera.matrixWorld.elements;let moved=labelsDirty;for(let i=0;i<16;i++)if(e[i]!==lastM[i]){moved=true;lastM[i]=e[i]}
 if(moved){updateLabels();labelsDirty=false}
 requestAnimationFrame(animate);
}

function start(){
 terrainGeo=buildTerrain();paintTerrain();
 scene.add(new THREE.Mesh(terrainGeo,new THREE.MeshLambertMaterial({vertexColors:true})));
 buildWater();buildMarkers();buildLabels();measure();
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(measure);
 resize();
 controls.target.set(wx(111.5),0,wz(31.5));
 camera.position.set(wx(111.5),26,wz(31.5)+9);
 controls.update();
 document.getElementById("loading").remove();
 flyTo(wx(111.5),0,wz(31.5),16);
 requestAnimationFrame(animate);
}
if(!window.THREE||!THREE.OrbitControls){document.getElementById("loading").textContent="地圖元件載入失敗，請重新整理頁面";}
else setTimeout(start,30);
</script>
</body>
