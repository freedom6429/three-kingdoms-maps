<!doctype html>
<html lang="zh-Hant">
<head>

<title>第十六回　呂奉先射戟轅門　曹孟德敗師淯水｜三國演義故事地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D9E2DC; --land:#E9EDE3; --land2:#DCE3D3; --water:#9FC2CF; --river:#6FA3B8; --sea-text:#4E7F93;
  --ink:#20302B; --soft:#5E6B66; --faint:#8E9993; --route:#A8352A; --route-soft:rgba(168,53,42,.28);
  --enemy:#3F5D86; --ally:#4B7A4E; --panel:#F6F8F4; --line:rgba(32,48,43,.14); --focus:#2F5D8A; --halo:#EEF2EA;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15201F; --land:#26332F; --land2:#2C3A35; --water:#1D3B48; --river:#4F8BA3; --sea-text:#7FB2C6;
  --ink:#E4EBE7; --soft:#A9B6B0; --faint:#6F7D77; --route:#E57B69; --route-soft:rgba(229,123,105,.3);
  --enemy:#8EAAD6; --ally:#8CC08F; --panel:#1E2A28; --line:rgba(228,235,231,.14); --focus:#9CC3EA; --halo:#26332F;}}
:root[data-theme="dark"]{
  --bg:#15201F; --land:#26332F; --land2:#2C3A35; --water:#1D3B48; --river:#4F8BA3; --sea-text:#7FB2C6;
  --ink:#E4EBE7; --soft:#A9B6B0; --faint:#6F7D77; --route:#E57B69; --route-soft:rgba(229,123,105,.3);
  --enemy:#8EAAD6; --ally:#8CC08F; --panel:#1E2A28; --line:rgba(228,235,231,.14); --focus:#9CC3EA; --halo:#26332F;}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg)}
body{height:100%;margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
@media (min-width:900px){#app{flex-direction:row}}
#mapWrap{position:relative;flex:1 1 55%;min-height:0}
svg#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
#title{position:absolute;left:12px;top:12px;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 12px 7px;opacity:.94}
#title h1{margin:0;font-family:var(--serif);font-weight:900;font-size:18px;letter-spacing:.08em}
#title p{margin:1px 0 0;font-size:12px;color:var(--soft)}
#title .home{pointer-events:auto;display:inline-block;margin-top:4px;font-size:13px;color:var(--route);font-weight:600}
#title .home:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#allBtn{position:absolute;right:12px;top:12px;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font:600 13px var(--sans);cursor:pointer}
#allBtn:focus-visible,.nav button:focus-visible,.dots button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#note{position:absolute;left:12px;bottom:8px;margin:0;font-size:11px;color:var(--soft);pointer-events:none}

#panel{flex:0 0 auto;max-height:48%;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line)}
@media (min-width:900px){#panel{flex:0 0 400px;max-height:none;border-top:0;border-left:1px solid var(--line)}}
.dots{display:flex;gap:4px;padding:10px 14px 0;flex-wrap:wrap}
.dots button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--soft);
  font:600 11px var(--sans);cursor:pointer;padding:0}
.dots button.done{background:var(--route-soft);color:var(--ink);border-color:transparent}
.dots button.cur{background:var(--route);color:#fff;border-color:transparent}
#card{flex:1 1 auto;overflow-y:auto;padding:10px 18px 12px}
#card .num{font-size:12px;color:var(--soft);margin:0}
#card h2{font-family:var(--serif);font-weight:900;font-size:24px;margin:2px 0 2px;letter-spacing:.05em}
#card .where{margin:0 0 10px;font-size:14px;color:var(--soft)}
#card .where b{font-family:var(--serif);color:var(--ink);font-size:15px}
#card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 12px}
#card dt{font-size:13px;font-weight:700;color:var(--route);padding-top:2px;white-space:nowrap}
#card dd{margin:0;font-size:15px;line-height:1.75}
#card .ppl{display:flex;flex-wrap:wrap;gap:6px}
#card .p{font-size:13px;padding:1px 9px;border-radius:10px;border:1px solid var(--line)}
#card .p.a{color:var(--ally);border-color:currentColor}
#card .p.e{color:var(--enemy);border-color:currentColor}
#card .p.n{color:var(--soft)}
#card .aside{margin:12px 0 0;font-size:13px;color:var(--soft);line-height:1.7}
.nav{display:flex;gap:10px;padding:10px 14px 12px;border-top:1px solid var(--line)}
.nav button{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--ink);
  font:600 15px var(--sans);cursor:pointer}
.nav button.primary{background:var(--route);color:#fff;border-color:transparent}
.nav button:disabled{opacity:.35;cursor:default}

/* 地圖元素 */
.sea{fill:var(--water)} .landbg{fill:var(--land)}
.riv{fill:none;stroke:var(--river);stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.lake{fill:var(--water);stroke:var(--river);vector-effect:non-scaling-stroke;stroke-width:.8}
.wlabel{fill:var(--sea-text);font-family:var(--serif);font-size:calc(13px*var(--k));letter-spacing:.3em}
.region{fill:var(--faint);font-family:var(--serif);font-weight:700;font-size:calc(17px*var(--k));letter-spacing:.6em;opacity:.7}
.plabel{font-family:var(--serif);font-weight:700;fill:var(--ink);font-size:calc(14px*var(--k));paint-order:stroke;
  stroke:var(--land);stroke-width:calc(4px*var(--k));stroke-linejoin:round}
.plabel.ctx{font-weight:500;fill:var(--soft);font-size:calc(12px*var(--k))}
.plabel.on{fill:var(--route);font-size:calc(17px*var(--k))}
.pnow{fill:var(--soft);font-size:calc(10.5px*var(--k));font-family:var(--sans);paint-order:stroke;stroke:var(--land);stroke-width:calc(3px*var(--k))}
.dot{fill:var(--panel);stroke:var(--ink);vector-effect:non-scaling-stroke;stroke-width:1.5}
.dot.ctx{fill:var(--faint);stroke:none}
.dot.visited{fill:var(--route);stroke:var(--panel)}
.halo{fill:none;stroke:var(--route);vector-effect:non-scaling-stroke;stroke-width:2}
.route{fill:none;stroke:var(--route);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.route.past{stroke:var(--route-soft)}
.side{fill:none;stroke-width:2;stroke-dasharray:6 5;stroke-linecap:round;vector-effect:non-scaling-stroke}
.side.flee{stroke:var(--enemy)} .side.ally{stroke:var(--ally)} .side.msg{stroke:var(--soft);stroke-dasharray:2 5}
.side.lu{stroke:var(--soft)}
.slabel{font-size:calc(11.5px*var(--k));font-family:var(--sans);paint-order:stroke;stroke:var(--land);stroke-width:calc(3px*var(--k))}
.slabel.flee{fill:var(--enemy)} .slabel.ally{fill:var(--ally)} .slabel.msg,.slabel.lu{fill:var(--soft)}
.hit{fill:transparent;cursor:pointer}
@media (prefers-reduced-motion: reduce){.halo{display:none}}
</style>
</head>

<div id="app">
  <div id="mapWrap">

    <div id="title"><h1>轅門射戟　淯水之敗</h1><p>第十六回　呂奉先射戟轅門　曹孟德敗師淯水</p><a class="home" href="./">回目錄</a></div>

</div>
<script>
"use strict";
/* ---------- 地點 ---------- */
const PL={
 shouchun:{n:"壽春",lon:116.78,lat:32.57,now:"安徽壽縣",ax:"r"},
 xiaopei:{n:"小沛",lon:116.93,lat:34.73,now:"江蘇沛縣",ax:"t"},
 xiapi:{n:"徐州（下邳）",lon:117.95,lat:34.08,now:"江蘇睢寧古邳鎮",ax:"b"},
 xudu:{n:"許都",lon:113.85,lat:34.03,now:"河南許昌東",ax:"b"},
 wan:{n:"宛城",lon:112.53,lat:33.0,now:"河南南陽",ax:"t"}
};
const CTX=[["襄陽",112.14,32.03],["新野",112.36,32.52],["葉",113.33,33.62],["彭城",117.18,34.27],["譙",115.78,33.85],["陳",114.9,33.73],["汝南",114.63,32.96],["睢陽",115.65,34.42],["陳留",114.8,34.45],["鍾離",117.55,32.87]];

/* ---------- 情節 ----------
   紅線：第 1～13 站是劉備的移動路線，第 14 站起是曹操的行軍路線。呂布在本回先救劉備、後打劉備，
   他「站在第三方」時用灰色人物標籤與灰色虛線（lu），與劉備為敵時用藍色。 */
const STEPS=[
 {at:"shouchun",title:"收買呂布",from:null,
  sides:[{kind:"msg",pts:[[116.78,32.57],[117.4,33.3],[117.95,34.08]],label:"韓胤送糧給呂布",at:[117.95,33.3]},
         {kind:"flee",pts:[[116.78,32.57],[116.7,33.6],[116.93,34.6]],label:"紀靈帶兵數萬攻小沛",at:[116.1,33.15]}],
  who:[["袁術","e"],["韓胤","e"],["紀靈","e"],["呂布","n"]],
  what:"袁術想先打小沛的劉備，又怕徐州的呂布出兵幫忙。他採用部將的計策，送給呂布二十萬斛糧食，派韓胤帶著密信去拉攏。",
  result:"呂布收下糧食，非常高興。袁術就派大將紀靈帶兵數萬，進攻小沛。",aside:"這一年是 196 年。紀靈帶了兩名副將雷簿、陳蘭。"},
 {at:"xiaopei",title:"寫信求救",from:null,
  sides:[{kind:"msg",pts:[[116.93,34.73],[117.5,34.5],[117.95,34.08]],label:"劉備寫信求救",at:[117.7,34.62]}],
  who:[["劉備","a"],["張飛","a"],["孫乾","a"],["紀靈","e"]],
  what:"劉備在小沛只有五千多人，糧食也少。張飛想出城硬拚，孫乾建議寫信向呂布求救。張飛不相信呂布會來，劉備還是寫了信。",
  result:"求救信送到徐州。",aside:"之前呂布趁張飛酒醉奪走徐州，劉備才退到小沛，所以張飛很恨呂布。"},
 {at:"xiapi",title:"呂布出兵",from:null,
  sides:[{kind:"lu",pts:[[117.95,34.08],[117.5,34.5],[116.97,34.7]],label:"呂布帶兵來救",at:[117.75,34.62]}],
  who:[["呂布","n"],["陳宮","n"]],
  what:"呂布和陳宮商量：袁術送糧，是要他別救劉備。可是如果袁術吞掉小沛，再往北聯合泰山一帶的將領，徐州就睡不安穩了。",
  result:"呂布決定救劉備，帶兵到小沛西南一里紮營。紀靈則在沛縣東南紮營，三方對峙。",aside:"原文只寫「徐州」。當時徐州的州治在下邳，呂布就住在這裡。"},
 {at:"xiaopei",title:"三方會面",from:null,
  who:[["呂布","n"],["劉備","a"],["關羽","a"],["張飛","a"],["紀靈","e"]],
  what:"呂布同時請劉備和紀靈到營中喝酒。紀靈一進門看到劉備，轉身就走，被呂布像拎小孩一樣抓回來。呂布說自己不愛打架，只愛勸架。席上紀靈不肯退兵，張飛拔劍大罵，被關羽攔下。",
  result:"呂布發起脾氣，叫人拿來他的畫戟。",aside:"紀靈稱劉備為「大耳兒」，是取笑劉備耳朵大。"},
 {at:"xiaopei",title:"轅門射戟",from:null,
  who:[["呂布","n"],["紀靈","e"],["劉備","a"]],
  what:"呂布把畫戟插在一百五十步外的轅門，約定一箭射中戟上的小枝，兩家就罷兵。紀靈認為不可能射中，一口答應。呂布拉滿弓，一箭正中小枝。",
  result:"紀靈只好答應退兵。第二天，三方的軍隊都散了。",aside:"一百五十步大約兩百公尺，換算說法不一。轅門射戟在正史《三國志》中也有記載。"},
 {at:"shouchun",title:"疏不間親",from:null,
  sides:[{kind:"flee",pts:[[116.93,34.73],[116.6,33.6],[116.78,32.57]],label:"紀靈退回淮南",at:[116.15,33.15]},
         {kind:"msg",pts:[[116.78,32.57],[117.4,33.3],[117.95,34.08]],label:"韓胤到徐州提親",at:[117.95,33.3]}],
  who:[["袁術","e"],["紀靈","e"],["韓胤","e"]],
  what:"紀靈回報射戟的事，袁術大怒，要親自出兵。紀靈勸他改用「疏不間親」之計：替兒子向呂布的女兒提親，兩家成了親家，呂布自然會殺劉備。",
  result:"袁術派韓胤帶著禮物，到徐州向呂布提親。",aside:"「疏不間親」意思是關係遠的人，挑撥不了關係親的人。"},
 {at:"xiapi",title:"急著送嫁",from:null,
  sides:[{kind:"lu",pts:[[117.95,34.08],[117.88,33.92],[117.78,33.72]],label:"送嫁隊伍前往壽春",at:[117.3,33.65]}],
  who:[["呂布","n"],["嚴氏（呂布妻）","n"],["陳宮","n"],["韓胤","e"]],
  what:"呂布的妻子嚴氏認為袁術遲早當皇帝，女兒有機會當皇后，勸呂布答應婚事。陳宮怕拖久了生變，勸呂布趁其他諸侯還不知道，馬上把女兒送到壽春。",
  result:"呂布連夜準備嫁妝，派宋憲、魏續和韓胤一起護送女兒出城。",aside:""},
 {at:"xiapi",title:"半路搶親",from:null,
  sides:[{kind:"lu",pts:[[117.78,33.72],[117.88,33.92],[117.95,34.08]],label:"張遼追回女兒",at:[117.35,33.65]}],
  who:[["陳珪","n"],["呂布","n"],["張遼","n"],["韓胤","e"]],
  what:"陳登的父親陳珪聽到鑼鼓聲，帶病來見呂布，說袁術是拿女兒當人質；而且袁術想稱帝，呂布會變成反賊的親戚。",
  result:"呂布派張遼追出三十里，把女兒搶回來，連韓胤也抓回來關住。",aside:"三十里約十幾公里，地圖上是大約位置。"},
 {at:"xiaopei",title:"張飛搶馬",from:null,
  who:[["張飛","a"],["宋憲（呂布部將）","e"],["魏續（呂布部將）","e"],["呂布","e"]],
  what:"宋憲、魏續替呂布到山東買了三百多匹好馬，回到沛縣邊界時被搶走一半。打聽之後，原來是張飛假扮山賊搶的。",
  result:"呂布大怒，帶兵往小沛找張飛算帳。",aside:"這裡的「山東」泛指華山、崤山以東，買馬的確切地點原文沒寫，所以地圖上沒有畫這段路線。"},
 {at:"xiaopei",title:"大戰小沛",from:null,
  sides:[{kind:"flee",pts:[[117.95,34.08],[117.5,34.5],[116.97,34.7]],label:"呂布帶兵攻打小沛",at:[117.8,34.62]}],
  who:[["呂布","e"],["陳宮","e"],["張飛","a"],["劉備","a"]],
  what:"張飛承認搶了馬，還罵呂布搶了哥哥的徐州。兩人大戰一百多回合，不分勝負。劉備願意還馬求和，呂布本來想答應，陳宮勸他趁機除掉劉備。",
  result:"呂布四面包圍小沛，攻城越來越急。",aside:""},
 {at:"xudu",title:"投奔曹操",from:[[116.3,34.5],[115.65,34.42],[114.7,34.25]],
  sides:[{kind:"flee",pts:[[116.93,34.73],[117.5,34.5],[117.95,34.08]],label:"呂布回徐州",at:[117.7,34.62]}],
  who:[["劉備","a"],["關羽","a"],["張飛","a"],["孫乾","a"],["糜竺","a"],["宋憲","e"],["魏續","e"],["張遼","e"],["曹操","n"]],
  what:"孫乾建議投奔曹操。半夜三更，張飛在前開路，關羽在後斷後，劉備保護家眷從北門殺出重圍。到了許都，曹操以上賓之禮接待劉備。",
  result:"曹操答應和劉備聯手對付呂布。呂布沒有追趕，留高順守小沛，自己回徐州。",aside:"許都在今天河南許昌的東邊，當時漢獻帝住在這裡，由曹操掌控。"},
 {at:"xudu",title:"郭嘉勸阻",from:null,
  who:[["曹操","n"],["荀彧","n"],["郭嘉","n"],["程昱","n"]],
  what:"荀彧、程昱都勸曹操趁早除掉劉備。郭嘉反對：劉備走投無路來投靠，如果殺了他，天下有本事的人就不敢來了。",
  result:"曹操同意郭嘉的看法，上表推薦劉備擔任豫州牧。",aside:""},
 {at:"xudu",title:"前往豫州",from:null,
  sides:[{kind:"ally",pts:[[113.85,34.03],[114.4,34.0],[115.0,33.95]],label:"劉備前往豫州",at:[114.65,33.86]},
         {kind:"msg",pts:[[115.0,33.95],[114.5,34.2],[113.95,34.12]],label:"派人約曹操出兵",at:[114.45,34.32]}],
  who:[["劉備","a"],["曹操","n"],["高順（呂布部將）","e"]],
  what:"曹操送給劉備三千兵、一萬斛糧食，要他到豫州上任，再進兵小沛，把走散的士兵招回來，一起攻打呂布。",
  result:"劉備到了豫州，派人和曹操約定出兵的時間。這時小沛還在高順手上，劉備要等曹操一起出兵。",aside:"「進兵小沛、攻呂布」是曹操交代的任務，還沒有發生。原文沒寫劉備到了豫州的哪裡，綠線只表示方向；東漢豫州的州治一般認為在譙。"},
 {at:"xudu",title:"張繡起兵",from:null,
  sides:[{kind:"msg",pts:[[112.53,33.0],[113.1,33.4],[113.8,33.95]],label:"快馬來報",at:[112.7,33.5]},
         {kind:"msg",pts:[[113.85,34.03],[115.6,34.0],[117.95,34.08]],label:"王則帶詔書前往徐州",at:[116.1,34.12]}],
  who:[["曹操","a"],["荀彧","a"],["王則","a"],["張繡","e"],["賈詡","e"]],

/* ---------- 投影與繪製 ---------- */
const KX=0.83,LON0=111.6,LAT0=35.6,S=100;
const X=lon=>(lon-LON0)*KX*S, Y=lat=>(LAT0-lat)*S;
const W=(119.0-LON0)*KX*S, H=(LAT0-31.7)*S;
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("map");
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||svg).appendChild(e);return e}
const pts=a=>a.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ");
function smooth(a){ // Catmull-Rom 轉貝茲曲線
 const p=a.map(q=>[X(q[0]),Y(q[1])]);if(p.length<3)return "M"+p.map(q=>q.join(",")).join("L");
 let d="M"+p[0].join(",");for(let i=0;i<p.length-1;i++){const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;
  d+=`C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`}return d}

const RIV={
 "黃河":{w:4,p:[[111.3,34.75],[112.0,34.8],[112.8,34.85],[113.3,34.9],[114.0,34.95],[114.7,35.15],[115.1,35.6],[115.3,36.0]]},
 "淮河":{w:3,p:[[112.8,32.4],[113.3,32.4],[114.3,32.35],[115.3,32.45],[116.2,32.5],[116.8,32.75],[117.35,32.95],[118.0,33.15],[118.6,33.35],[119.0,33.5],[119.5,33.6]]},
 "泗水":{w:2.2,p:[[117.05,36.0],[117.05,35.6],[116.98,35.1],[116.99,34.72],[117.18,34.3],[117.6,34.15],[117.97,34.07],[118.4,33.65],[118.85,33.4]]},
 "沂水":{w:1.4,p:[[118.5,36.0],[118.45,35.6],[118.2,34.9],[118.0,34.1]]},
 "汴水":{w:1.6,p:[[113.6,34.82],[114.35,34.8],[115.0,34.6],[115.65,34.42],[116.4,34.35],[117.18,34.28]]},
 "潁水":{w:1.6,p:[[112.9,34.45],[113.3,34.35],[113.6,34.12],[113.9,33.8],[114.65,33.62],[115.3,33.3],[115.8,32.9],[116.5,32.55]]},
 "淯水":{w:1.8,p:[[112.3,33.8],[112.45,33.4],[112.6,33.0],[112.52,32.75],[112.37,32.5],[112.25,32.22],[112.15,32.05]]},
 "漢水":{w:3,p:[[111.2,32.6],[111.6,32.45],[111.95,32.15],[112.15,32.05],[112.25,31.8],[112.3,31.5]]},
 "渦水":{w:1.4,p:[[114.4,34.5],[115.2,34.1],[115.78,33.86],[116.5,33.4],[117.2,32.95]]}
};

function drawBase(){
 el("rect",{x:-600,y:-600,width:W+1200,height:H+1200,class:"landbg"});
 for(const n in RIV)el("path",{d:smooth(RIV[n].p),class:"riv","stroke-width":RIV[n].w});
 const wl=(t,lon,lat,rot)=>{const e=el("text",{x:X(lon),y:Y(lat),class:"wlabel","text-anchor":"middle",transform:rot?`rotate(${rot} ${X(lon)} ${Y(lat)})`:""});e.textContent=t};
 wl("黃河",114.1,35.08,-12);wl("淮河",115.1,32.33,-3);wl("泗水",117.2,35.2,-88);wl("沂水",118.5,35.15,-70);
 wl("汴水",114.6,34.83,10);wl("潁水",114.25,33.6,22);wl("渦水",116.25,33.47,38);wl("淯水",112.32,33.45,-72);wl("漢水",111.7,32.25,-30);
 const rg=(t,lon,lat)=>{const e=el("text",{x:X(lon),y:Y(lat),class:"region","text-anchor":"middle"});e.textContent=t};
 rg("兗州",115.8,35.3);rg("豫州",114.4,33.2);rg("徐州",118.45,34.55);rg("揚州",117.9,32.35);rg("荊州",111.95,32.75);
}
drawBase();
const sideLayer=el("g",{}),routeLayer=el("g",{}),dotLayer=el("g",{}),labelLayer=el("g",{});
const routePast=el("path",{class:"route past"},routeLayer),routeCur=el("path",{class:"route"},routeLayer);
const halo=el("circle",{class:"halo",r:10},dotLayer);

// 背景小地名
const ctxDots=[];
for(const c of CTX){const d=el("circle",{cx:X(c[1]),cy:Y(c[2]),r:2.5,class:"dot ctx"},dotLayer);ctxDots.push(d);
 const t=el("text",{x:X(c[1])+6,y:Y(c[2])+4,class:"plabel ctx"},labelLayer);t.textContent=c[0]}
// 情節地點
for(const id in PL){const p=PL[id],x=X(p.lon),y=Y(p.lat);
 p.dot=el("circle",{cx:x,cy:y,r:5,class:"dot"},dotLayer);
 const pos={r:[9,5,"start"],l:[-9,5,"end"],t:[0,-11,"middle"],b:[0,20,"middle"]}[p.ax];
 p.label=el("text",{x:x+pos[0],y:y+pos[1],"text-anchor":pos[2],class:"plabel"},labelLayer);p.label.textContent=p.n;
 const hit=el("circle",{cx:x,cy:y,r:16,class:"hit",tabindex:"0",role:"button","aria-label":p.n},labelLayer);
 const go=()=>{const idx=findStep(id);if(idx>=0)show(idx)};
 hit.addEventListener("click",go);hit.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}});
}
function findStep(id){ // 點地點：先找目前之後最近的一站，找不到再往前找
 for(let i=cur+1;i<STEPS.length;i++)if(STEPS[i].at===id)return i;
 for(let i=cur;i>=0;i--)if(STEPS[i].at===id)return i;return -1}

/* 每一站的完整路段：前一個劉備所在地 → 中繼點 → 本站。劉備從小沛出發。 */
let last=[PL.xiaopei.lon,PL.xiaopei.lat];
for(const s of STEPS){
 const here=[PL[s.at].lon,PL[s.at].lat];
 if(s.from===null){s.seg=null}
 else{s.seg=[last,...s.from,here];last=here}
}

/* ---------- 鏡頭 ---------- */
let vb={x:0,y:0,w:W,h:H},anim=null;
function setVB(v){svg.setAttribute("viewBox",`${v.x} ${v.y} ${v.w} ${v.h}`);
 const k=v.w/Math.max(svg.clientWidth,1);svg.style.setProperty("--k",k.toFixed(4));
 const r=k;for(const id in PL){PL[id].dot.setAttribute("r",(5*r).toFixed(2))}for(const d of ctxDots)d.setAttribute("r",(2.6*r).toFixed(2));halo.setAttribute("r",(12*r).toFixed(2))}
function fit(points,pad){
 let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const p of points){const x=X(p[0]),y=Y(p[1]);x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}
 const cw=svg.clientWidth||1,ch=svg.clientHeight||1,aspect=cw/ch;
 const top=Math.min(100,ch*.3),eff=cw/Math.max(ch-top,1); // 預留上方標題框的高度
 let w=Math.max(x1-x0,180)+pad*2,h=Math.max(y1-y0,140)+pad*2;
 if(w/h<eff)w=h*eff;else h=w/eff;
 const extra=top*w/cw;
 return{x:(x0+x1)/2-w/2,y:(y0+y1)/2-h/2-extra,w,h:h+extra}}
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function moveTo(target){if(reduce){vb=target;setVB(vb);return}
 const from={...vb},t0=performance.now();
 anim=target;const step=now=>{if(anim!==target)return;let t=Math.min(1,(now-t0)/700);t=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  vb={x:from.x+(target.x-from.x)*t,y:from.y+(target.y-from.y)*t,w:from.w+(target.w-from.w)*t,h:from.h+(target.h-from.h)*t};setVB(vb);
  if(t<1)requestAnimationFrame(step)};requestAnimationFrame(step)}

/* ---------- 顯示某一站 ---------- */
let cur=0,overview=false,drawAnim=null;
const dotsBox=document.getElementById("dots");
STEPS.forEach((s,i)=>{const b=document.createElement("button");b.type="button";b.textContent=i+1;b.setAttribute("aria-label",`第 ${i+1} 站：${s.title}`);
 b.addEventListener("click",()=>show(i));dotsBox.appendChild(b)});

function pathD(segs){return segs.map(s=>smooth(s)).join(" ")}
function focusPts(s,p){return [[p.lon,p.lat],...(s.seg||[]),...(s.sides||[]).flatMap(q=>[...q.pts,q.at])]}
function show(i){
 cur=i;overview=false;const s=STEPS[i],p=PL[s.at];
 // 已走過的路線
 const past=STEPS.slice(0,i).filter(q=>q.seg).map(q=>q.seg);
 routePast.setAttribute("d",past.length?pathD(past):"");
 // 本站路線（逐步畫出）
 cancelAnimationFrame(drawAnim);
 if(s.seg){
  const full=s.seg;
  if(reduce){routeCur.setAttribute("d",smooth(full))}
  else{const t0=performance.now();const tick=now=>{const t=Math.min(1,(now-t0)/900);routeCur.setAttribute("d",smooth(partial(full,t)));if(t<1)drawAnim=requestAnimationFrame(tick)};drawAnim=requestAnimationFrame(tick)}
 }else routeCur.setAttribute("d","");
 // 支線
 sideLayer.innerHTML="";
 for(const sd of s.sides||[]){el("path",{d:smooth(sd.pts),class:"side "+sd.kind},sideLayer);
  const t=el("text",{x:X(sd.at[0]),y:Y(sd.at[1]),class:"slabel "+sd.kind,"text-anchor":"middle"},sideLayer);t.textContent=sd.label}
 // 地點狀態
 const visited=new Set(STEPS.slice(0,i+1).map(q=>q.at));
 for(const id in PL){PL[id].dot.setAttribute("class","dot"+(visited.has(id)?" visited":""));PL[id].label.setAttribute("class","plabel"+(id===s.at?" on":""))}
 halo.setAttribute("cx",X(p.lon));halo.setAttribute("cy",Y(p.lat));
 // 鏡頭
 moveTo(fit(focusPts(s,p),90));
 // 資訊卡
 const card=document.getElementById("card");
 card.innerHTML=`<p class="num">第 ${i+1} 站，共 ${STEPS.length} 站</p><h2></h2><p class="where"><b></b>　今 <span></span></p>
  <dl><dt>遭遇</dt><dd class="ppl"></dd><dt>經過</dt><dd class="what"></dd><dt>結果</dt><dd class="res"></dd></dl><p class="aside"></p>`;
 card.querySelector("h2").textContent=s.title;card.querySelector(".where b").textContent=p.n;card.querySelector(".where span").textContent=p.now;
 const ppl=card.querySelector(".ppl");for(const w of s.who){const e=document.createElement("span");e.className="p "+w[1];e.textContent=w[0];ppl.appendChild(e)}
 card.querySelector(".what").textContent=s.what;card.querySelector(".res").textContent=s.result;
 const as=card.querySelector(".aside");as.textContent=s.aside;as.hidden=!s.aside;
 card.scrollTop=0;
 [...dotsBox.children].forEach((b,j)=>{b.className=j<i?"done":j===i?"cur":"";b.setAttribute("aria-current",j===i?"step":"false")});
 document.getElementById("prev").disabled=i===0;
 const nx=document.getElementById("next");nx.disabled=i===STEPS.length-1;
}
function partial(a,t){ // 取折線前 t 比例
 const P=a.map(q=>[X(q[0]),Y(q[1])]);let L=0;const seg=[];for(let k=0;k<P.length-1;k++){const d=Math.hypot(P[k+1][0]-P[k][0],P[k+1][1]-P[k][1]);seg.push(d);L+=d}
 let need=L*t;const out=[a[0]];for(let k=0;k<seg.length;k++){if(need>=seg[k]){out.push(a[k+1]);need-=seg[k]}else{const f=seg[k]?need/seg[k]:0;out.push([a[k][0]+(a[k+1][0]-a[k][0])*f,a[k][1]+(a[k+1][1]-a[k][1])*f]);break}}
 return out}

function showAll(){
 overview=true;cancelAnimationFrame(drawAnim);
 routePast.setAttribute("d",pathD(STEPS.filter(q=>q.seg).map(q=>q.seg)));routeCur.setAttribute("d","");sideLayer.innerHTML="";
 for(const id in PL){PL[id].dot.setAttribute("class","dot visited");PL[id].label.setAttribute("class","plabel")}
 halo.setAttribute("cx",-999);
 moveTo(fit(Object.values(PL).map(p=>[p.lon,p.lat]),75));
}
document.getElementById("prev").addEventListener("click",()=>show(Math.max(0,cur-1)));
document.getElementById("next").addEventListener("click",()=>show(Math.min(STEPS.length-1,overview?cur:cur+1)));
document.getElementById("allBtn").addEventListener("click",showAll);
addEventListener("keydown",e=>{if(e.key==="ArrowRight")show(Math.min(STEPS.length-1,cur+1));if(e.key==="ArrowLeft")show(Math.max(0,cur-1))});
addEventListener("resize",()=>{if(overview)showAll();else{const s=STEPS[cur],p=PL[s.at];vb=fit(focusPts(s,p),70);setVB(vb)}});
// 起始
vb=fit(Object.values(PL).map(p=>[p.lon,p.lat]),75);setVB(vb);
requestAnimationFrame(()=>show(0));
if(document.fonts)document.fonts.ready.then(()=>setVB(vb));
</script>
