<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三國演義故事地圖｜老羅說書</title>
<meta name="description" content="搭配地圖聽故事，包括重要事件的發生地點以及行軍路線。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#DDE5DF; --card:#F4F7F2; --ink:#20302B; --soft:#5E6B66; --line:rgba(32,48,43,.14); --accent:#A8352A; --focus:#2F5D8A;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#16211F;--card:#1F2B29;--ink:#E4EBE7;--soft:#A9B6B0;--line:rgba(228,235,231,.14);--accent:#E57B69;--focus:#9CC3EA}}
:root[data-theme="dark"]{--bg:#16211F;--card:#1F2B29;--ink:#E4EBE7;--soft:#A9B6B0;--line:rgba(228,235,231,.14);--accent:#E57B69;--focus:#9CC3EA}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.7}
main{max-width:640px;margin:0 auto;padding:40px 20px 56px}
header .brand{margin:0;font-family:var(--serif);font-weight:700;font-size:16px;letter-spacing:.2em;color:var(--accent)}
header h1{font-family:var(--serif);font-weight:900;font-size:clamp(30px,8vw,42px);letter-spacing:.1em;margin:4px 0 0;line-height:1.3}
header .lead{margin:10px 0 0;color:var(--soft);font-size:16px}

a.feature{display:block;margin-top:32px;padding:18px 20px;border-radius:14px;background:var(--card);
  border:1px solid var(--line);color:inherit;text-decoration:none}
a.feature .t{display:block;font-family:var(--serif);font-weight:900;font-size:22px;letter-spacing:.06em}
a.feature .d{display:block;margin-top:4px;font-size:14px;color:var(--soft)}
a.feature .go{display:inline-block;margin-top:12px;font-size:14px;font-weight:700;color:var(--accent)}
a.feature:hover .t{color:var(--accent)}
a.feature:focus-visible,a.item:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

section{margin-top:40px}
section h2{font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:.1em;margin:0 0 6px;
  padding-bottom:8px;border-bottom:2px solid var(--ink)}
ol{list-style:none;margin:0;padding:0}
li+li{border-top:1px solid var(--line)}
a.item{display:grid;grid-template-columns:5em 1fr;gap:2px 14px;padding:14px 4px;color:inherit;text-decoration:none;border-radius:6px}
a.item:hover .t{color:var(--accent)}
.n{font-family:var(--serif);font-weight:700;color:var(--accent);font-size:15px;padding-top:3px}
.t{font-family:var(--serif);font-weight:700;font-size:19px;line-height:1.5}
.d{grid-column:2;font-size:14px;color:var(--soft)}
footer{margin-top:48px;font-size:13px;color:var(--soft)}
</style>
</head>
<body>
<main>
  <header>
    <p class="brand">老羅說書</p>
    <h1>三國演義故事地圖</h1>
    <p class="lead">搭配地圖聽故事，包括重要事件的發生地點以及行軍路線。</p>
  </header>

  <a class="feature" href="sanguo-map.html">
    <span class="t">三國立體地圖</span>
    <span class="d">三國時代的山川、河流、十三州與重要城市。可以搜尋古地名，看看它在今天的哪裡。</span>
    <span class="go">打開地圖</span>
  </a>

  <section aria-labelledby="eps">
    <h2 id="eps">各回地圖</h2>
    <ol>
      <li><a class="item" href="sanguo-15.html"><span class="n">第十五回</span><span class="t">太史慈酣鬥小霸王<br>孫伯符大戰嚴白虎</span><span class="d">從壽春借兵到拿下會稽，一站一站看孫策的進軍路線。</span></a></li>
    </ol>
  </section>

  <footer>地圖上的位置與界線為示意，供收聽參考。</footer>
</main>
</body>
</html>
